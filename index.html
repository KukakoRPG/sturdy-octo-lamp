<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Terminal</title>
    <link href="src/terminal.css" rel="stylesheet" type="text/css">
  </head>
  <body>
    <div id="container">
      <output></output>
      <div id="input-line" class="input-line">
        <div class="prompt"></div><div><input class="cmdline" autofocus /></div>
      </div>
    </div>
    <!-- Audio elements for terminal sounds -->
  <audio id="ambient-audio" src="src/sounds/ambient.mp3" loop preload="auto"></audio>
  <audio id="key-audio" src="src/sounds/key.mp3" preload="auto"></audio>
  <audio id="output-ambient-audio" src="src/sounds/output-ambient.mp3" preload="auto"></audio>
    <button id="mute-btn" style="position: absolute; top: 10px; right: 10px; z-index: 1000;">Mute</button>
    <script src="src/lib/jquery-2.1.1.min.js"></script>
    <script src="src/error.js"></script>
    <script src="src/kernel.js"></script>
    <script src="src/terminal.js"></script>
    <script src="config/software.js"></script>
    <script src="src/hack-reveal.js"></script>
    <!-- This dependency is only needed for glitch-img.js, so load it last: -->
    <script src="src/lib/p5-0.5.7.min.js"></script>
    <script src="src/glitch-img.js"></script>
    <script src="src/particle-img.js"></script>
  </body>
</html>
